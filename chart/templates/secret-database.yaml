{{- if not .Values.database.existingSecret }}
{{- $name := printf "%s-database" (include "rainstone.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := "" }}
{{- if $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else if .Values.database.passwordSecret }}
{{- $password = index (lookup "v1" "Secret" .Release.Namespace .Values.database.passwordSecret).data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- $host := printf "%s-postgres" (include "rainstone.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "rainstone.labels" . | nindent 4 }}
  annotations:
    # Keep the credential and its data when the release is removed.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ $password | quote }}
  dsn: postgresql+psycopg://{{ .Values.database.user }}:{{ $password }}@{{ $host }}:5432/{{ .Values.database.name }}
{{- end }}
