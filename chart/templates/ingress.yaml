{{- if .Values.ingress.enabled }}
{{/*
The path is registered on the cluster's existing ingress controller, under the
Galaxy prefix. External admission remains the platform's responsibility; this
chart adds no separate entry point.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rainstone.fullname" . }}
  labels: {{- include "rainstone.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/x-forwarded-prefix: {{ .Values.basePath | quote }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          - path: {{ .Values.basePath }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "rainstone.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
