{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rainstone.serviceAccountName" . }}
  labels: {{- include "rainstone.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.collector.enabled .Values.collector.kubernetes.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rainstone.fullname" . }}-observer
  namespace: {{ .Values.collector.kubernetes.namespace | default .Release.Namespace }}
  labels: {{- include "rainstone.labels" . | nindent 4 }}
rules:
  # Observation only: list and watch job pods, never read logs or exec.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rainstone.fullname" . }}-observer
  namespace: {{ .Values.collector.kubernetes.namespace | default .Release.Namespace }}
  labels: {{- include "rainstone.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rainstone.fullname" . }}-observer
subjects:
  - kind: ServiceAccount
    name: {{ include "rainstone.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rainstone.fullname" . }}-nodes
  labels: {{- include "rainstone.labels" . | nindent 4 }}
rules:
  # Node descriptors supply placement, shape and region for allocation.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "rainstone.fullname" . }}-nodes
  labels: {{- include "rainstone.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "rainstone.fullname" . }}-nodes
subjects:
  - kind: ServiceAccount
    name: {{ include "rainstone.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
