{{/*
Separate identities with separate permissions:

- web serves reports and is bound to nothing;
- collector observes pods, batch jobs and nodes;
- initialization may write only the source credential Secret it provisions.

A Workload Identity binding belongs on the collector (and initialization) alone.
On a node whose metadata server is reachable from any pod, that node-wide
credential remains available regardless of Kubernetes service accounts; treat
metadata-server restriction as a deployment prerequisite rather than something
this chart can enforce.
*/}}
{{- if .Values.serviceAccounts.create }}
{{- range $component := list "web" "collector" "init" }}
{{- $config := index $.Values.serviceAccounts $component }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rainstone.serviceAccountName" (list $ $component) }}
  labels: {{- include "rainstone.labels" $ | nindent 4 }}
  {{- with $config.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if eq $component "web" }}
# The web process calls no Kubernetes API, so it receives no token.
automountServiceAccountToken: false
{{- end }}
---
{{- end }}
{{- end }}
{{- if .Values.source.provisionReader.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rainstone.fullname" . }}-init
  labels: {{- include "rainstone.labels" . | nindent 4 }}
rules:
  # Exactly one named Secret, which the chart pre-creates empty: initialization
  # fills it in and can read back what it published, with no permission to
  # create or read other Secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "rainstone.sourceSecret" . | quote }}]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rainstone.fullname" . }}-init
  labels: {{- include "rainstone.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rainstone.fullname" . }}-init
subjects:
  - kind: ServiceAccount
    name: {{ include "rainstone.serviceAccountName" (list . "init") }}
    namespace: {{ .Release.Namespace }}
---
{{- end }}
{{- if and .Values.collector.enabled .Values.collector.kubernetes.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rainstone.fullname" . }}-observer
  namespace: {{ .Values.collector.kubernetes.namespace | default .Release.Namespace }}
  labels: {{- include "rainstone.labels" . | nindent 4 }}
rules:
  # Observation only: list and watch job pods, never read logs or exec.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rainstone.fullname" . }}-observer
  namespace: {{ .Values.collector.kubernetes.namespace | default .Release.Namespace }}
  labels: {{- include "rainstone.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rainstone.fullname" . }}-observer
subjects:
  - kind: ServiceAccount
    name: {{ include "rainstone.serviceAccountName" (list . "collector") }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rainstone.fullname" . }}-nodes
  labels: {{- include "rainstone.labels" . | nindent 4 }}
rules:
  # Node descriptors supply placement, shape and region for allocation.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "rainstone.fullname" . }}-nodes
  labels: {{- include "rainstone.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "rainstone.fullname" . }}-nodes
subjects:
  - kind: ServiceAccount
    name: {{ include "rainstone.serviceAccountName" (list . "collector") }}
    namespace: {{ .Release.Namespace }}
{{- end }}
