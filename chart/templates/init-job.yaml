{{/*
On-VM initialization, run as one ordered sequence on install and upgrade:
database availability, migration, scoped reader provisioning and source/account
enrolment, catalog import, then a recorded self-check. Every step is idempotent,
so an interrupted run is simply re-run.

This is a post-install/post-upgrade hook because the chart's own database is
created as an ordinary resource and does not exist before install. Application
pods do not depend on hook ordering: each waits on `rainstone wait-ready`
before it can serve, so no pod serves against an unmigrated or unenrolled
database.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rainstone.fullname" . }}-init-{{ .Release.Revision }}
  labels: {{- include "rainstone.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "rainstone.labels" . | nindent 8 }}
        app.kubernetes.io/component: init
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "rainstone.serviceAccountName" (list . "init") }}
      containers:
        - name: init
          image: {{ include "rainstone.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -eu
            - -c
            - |
              echo "waiting for the Rainstone database"
              until python -c "
              import sys
              from sqlalchemy import text
              from rainstone.db import engine
              try:
                  with engine.connect() as connection:
                      connection.execute(text('SELECT 1'))
              except Exception as error:
                  print(error, file=sys.stderr)
                  sys.exit(1)
              "; do sleep 3; done
              alembic upgrade head
              {{- if .Values.source.adminSecret }}
              rainstone bootstrap \
                --admin-database-url "$RAINSTONE_BOOTSTRAP_DATABASE_URL" \
                --shared-account "{{ required "source.sharedAccount is required with source.adminSecret" .Values.source.sharedAccount }}" \
                --write-secret "{{ include "rainstone.sourceSecret" . }}/{{ .Values.source.dsnSecretKey }}" \
                {{- if .Values.source.replaceSource }}
                --replace-source \
                {{- end }}
                --descriptor /descriptor/descriptor.json
              {{- else }}
              echo "no source.adminSecret configured; skipping source enrolment"
              {{- end }}
              rainstone catalog refresh
              rainstone doctor || echo "self-check reported findings; see the status page"
          env:
            {{- include "rainstone.env" . | nindent 12 }}
            {{- if .Values.source.adminSecret }}
            - name: RAINSTONE_BOOTSTRAP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.source.adminSecret }}
                  key: {{ .Values.source.adminSecretKey }}
            {{- end }}
          volumeMounts:
            - name: descriptor
              mountPath: /descriptor
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
      volumes:
        - name: descriptor
          configMap:
            name: {{ include "rainstone.fullname" . }}-descriptor
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rainstone.fullname" . }}-descriptor
  labels: {{- include "rainstone.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  descriptor.json: |
    {
      "machine_type": {{ .Values.baseline.machineType | default "" | quote }},
      "region": {{ .Values.baseline.region | default "" | quote }},
      "zone": {{ .Values.baseline.zone | default "" | quote }},
      "resource_uid": {{ .Values.baseline.resourceUid | default "" | quote }},
      "base_path": {{ .Values.basePath | quote }},
      "release": {{ .Release.Name | quote }}
    }
