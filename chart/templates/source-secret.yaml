{{- if and .Values.source.adminSecret (not .Values.source.dsnSecret) }}
{{/*
The scoped reader Secret is created empty by the chart and filled in by
initialization. Pre-creating it keeps the initialization role restricted to
patching this one named Secret, with no permission to create Secrets at large.
Existing content is preserved: the resource policy keeps it across uninstall,
and `lookup` keeps a published DSN through upgrades.
*/}}
{{- $name := printf "%s-source" (include "rainstone.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "rainstone.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.source.dsnSecretKey }}: {{ if $existing }}{{ index $existing.data .Values.source.dsnSecretKey | default "" }}{{ else }}""{{ end }}
{{- end }}
