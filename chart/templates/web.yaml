apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rainstone.fullname" . }}-web
  labels: {{- include "rainstone.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rainstone.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "rainstone.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "rainstone.serviceAccountName" (list . "web") }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      initContainers:
        # No pod serves reports before the schema and instance enrolment this
        # release expects are in place.
        - name: wait-ready
          image: {{ include "rainstone.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["rainstone", "wait-ready", "--timeout", "900"]
          env: {{- include "rainstone.env" . | nindent 12 }}
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
      containers:
        - name: web
          image: {{ include "rainstone.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - uvicorn
            - rainstone.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          # The web process serves reports only: it holds no Galaxy source
          # credential and no cloud observation permissions.
          env: {{- include "rainstone.env" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          # Readiness reflects a compatible schema and a resolved fixed scope;
          # liveness stays a cheap process check so dependency problems do not
          # restart a healthy process.
          readinessProbe:
            httpGet: {path: /api/ready, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rainstone.fullname" . }}
  labels: {{- include "rainstone.labels" . | nindent 4 }}
spec:
  # ClusterIP only: no NodePort, LoadBalancer or independent public address.
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ include "rainstone.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
