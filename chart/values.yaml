# Operator-facing settings. `rainstone discover` resolves most of these from
# what the cluster and the Galaxy host already record; the rest are the choices
# that are genuinely an operator's: where Rainstone runs and where its data
# lives.
image:
  repository: docker.io/afgane/rainstone
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# External path this deployment is served under, derived from the Galaxy prefix
# (for example /galaxy/costs). The chart never creates an independent public
# address: it registers a path on the existing ingress and a ClusterIP service.
basePath: /galaxy/costs

ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: ""

service:
  port: 8000

# Galaxy links sibling applications from its masthead through a webhook, which
# is how the Kubernetes monitor is surfaced. The chart ships the webhook
# ConfigMap; Galaxy's own release mounts it, because only Galaxy's deployment
# can add a volume to Galaxy's pod. See chart/templates/webhook.yaml.
galaxyWebhook:
  enabled: true
  id: rainstone
  icon: fa-dollar-sign
  tooltip: Compute cost

# Identity. `anvil-workspace` reports one fixed tenant and shared Galaxy
# account behind the platform's external admission boundary.
auth:
  mode: anvil-workspace
  workspaceOwner: ""            # Galaxy username, numeric ID or exact email
  workspaceInfrastructureVisible: true

instance:
  slug: ""                      # stable instance identity; discovery supplies one
  displayName: Galaxy deployment

# Rainstone's own database: either an existing DSN Secret or the chart's own
# PostgreSQL deployment. It is a separate database from Galaxy's and never
# shares Galaxy's PostgreSQL data directory.
database:
  existingSecret: ""            # Secret with key `dsn`
  existingSecretKey: dsn
  deploy: true
  image: postgres:17.6-alpine
  # Reporting history and the enrollment identity live here, so the storage
  # class must be one that survives stop, resume and reinstall. The chart
  # refuses to render without a decision rather than landing on whatever the
  # cluster's default happens to be.
  storageClass: ""
  acknowledgeEphemeralStorage: false
  size: 10Gi
  retainOnDelete: true
  name: rainstone
  user: rainstone
  passwordSecret: ""            # Secret with key `password`; generated when empty

# Galaxy source access. The default profile reads Galaxy with a credential that
# already exists and changes nothing in Galaxy's database: no schema, no
# identity table, no role creation and no administrator login.
source:
  # Galaxy's own application credential, as a Secret reference plus the service
  # it connects to. Never the PostgreSQL superuser Secret.
  existingSecret: ""
  usernameKey: username
  passwordKey: password
  host: ""
  port: 5432
  database: galaxy
  sslMode: ""
  options: ""                   # extra connection parameters, `a=b&c=d`
  # A complete DSN Secret instead, for standalone deployments that keep one.
  dsnSecret: ""
  dsnSecretKey: dsn
  # Optional, explicitly enabled provisioning: create a dedicated read-only
  # role in Galaxy's database and publish its credential, so the database
  # enforces the read-only boundary rather than Rainstone enforcing it. This
  # needs an installation-time credential with rights to create roles and
  # grants; it creates no Rainstone tables in Galaxy.
  provisionReader:
    enabled: false
    role: rainstone_reader
    adminSecret: ""
    adminSecretKey: dsn
  sharedAccount: ""             # defaults to auth.workspaceOwner
  statementTimeout: 30s
  batchSize: 500
  replayOverlapSeconds: 300
  # Non-secret deployment evidence recorded alongside the enrollment, such as a
  # boot run or disk identifier. Corroboration only; never identity.
  deploymentEvidence: ""

collector:
  enabled: true
  kubernetes:
    enabled: true
    namespace: ""               # defaults to the release namespace
  gcpBatch:
    # `auto` observes Batch whenever a project and location are configured.
    # Cloud reads use the identity this deployment already has — the VM's
    # metadata credential, or Workload Identity where a cluster already uses
    # it. Missing permissions are reported as gaps, never assumed.
    enabled: auto
    project: ""
    location: ""
    enrichCompute: true
    enrichLogging: true
  intervalSeconds: 30
  batchRefreshSeconds: 30

# Versioned baseline accounting policy for the Galaxy server already running.
# Discovery reads these from the host's own metadata.
baseline:
  policyVersion: ""
  resourceUid: ""
  machineType: ""
  region: ""
  zone: ""
  nodeNames: ""                 # what Kubernetes calls the same machine
  destinations: ""              # comma-separated Galaxy destination IDs
  # Galaxy local runners only. Kubernetes placement comes from pod observation,
  # and a runner matches only work recorded without a destination.
  runners: local
  # When the unchanged size and uptime assumptions start (and stop) holding, as
  # ISO 8601 with an offset. Saved with the policy version on first use; a
  # different period needs a new policyVersion.
  effectiveFrom: ""
  effectiveTo: ""

catalog:
  feedUrl: ""                   # anonymous, versioned artifact feed
  refreshSeconds: 21600
  # `key_id:base64-ed25519-public-key` pairs. A feed artifact is untrusted until
  # it verifies against one of these; listing two is how a key is rotated.
  trustedKeys: ""
  requireSignature: false

initialization:
  # Finished initialization Jobs are cleaned up by Kubernetes rather than kept
  # around per revision.
  ttlSecondsAfterFinished: 3600

retentionDays: 0                # 0 keeps all collected history

diagnosticsEnabled: true

# Requests are a scheduling floor, not an allocation. Rainstone reports on a
# cluster whose capacity belongs to Galaxy's jobs — on a small node each job pod
# may request a whole CPU — so it reserves little and bursts into idle capacity
# under its limits instead.
web:
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 128Mi}
    limits: {cpu: "1", memory: 1Gi}

collectorResources:
  requests: {cpu: 25m, memory: 128Mi}
  limits: {cpu: "1", memory: 1Gi}

# Separate identities: the web process must not hold observation permissions or
# the source credential. Note the inherited trust model — on a node whose
# metadata server is reachable by any pod, that node-wide cloud credential is
# available regardless of these accounts. That is a property of the platform,
# not something these accounts remove, and restricting it is not a prerequisite
# this chart imposes on installation.
serviceAccounts:
  create: true
  web:
    name: ""
    annotations: {}
  collector:
    name: ""
    annotations: {}             # Workload Identity annotation, where one is used
  init:
    name: ""
    annotations: {}

# In-cluster restriction only: it reduces in-cluster callers and is not a
# substitute for the platform's external admission boundary.
networkPolicy:
  enabled: false
  ingressNamespace: ingress-nginx
