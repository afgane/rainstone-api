[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "rainstone"
version = "2.0.0a1"
description = "Galaxy compute cost reporting"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "cryptography==46.0.7",
  "fastapi==0.116.1",
  "psycopg[binary]==3.2.10",
  "pyyaml==6.0.3",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "pytest-cov==6.2.1",
  "ruff==0.12.11",
]

[project.scripts]
rainstone = "rainstone.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/rainstone"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
# scripts/ carries the GCP pricing publisher, tested from backend/tests/unit
# alongside the application it feeds; this makes it importable there without
# packaging it into the rainstone wheel.
pythonpath = ["scripts"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
